<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <style>
      @keyframes scanMove { 0%,100%{transform:translateY(0)} 50%{transform:translateY(200px)} }
      @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
      @keyframes rain { 0%{opacity:.7;transform:translateY(-30px)} 100%{opacity:0;transform:translateY(220px)} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 2px #00FF9D)} 50%{filter:drop-shadow(0 0 12px #00FF9D)} }
      @keyframes dash { to { stroke-dashoffset: -1000; } }
      @keyframes nodeGlow { 0%,100%{r:2;opacity:.4} 50%{r:5;opacity:1} }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity=".4"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9D"/>
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="url(#bg)" rx="6"/>

  <!-- Grid -->
  <g opacity=".08" stroke="#00F0FF" stroke-width=".5" fill="none">
    <line x1="0" y1="44" x2="800" y2="44"/><line x1="0" y1="88" x2="800" y2="88"/>
    <line x1="0" y1="132" x2="800" y2="132"/><line x1="0" y1="176" x2="800" y2="176"/>
    <line x1="100" y1="0" x2="100" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/><line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="500" y1="0" x2="500" y2="220"/><line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="700" y1="0" x2="700" y2="220"/>
  </g>

  <!-- Animated scan line -->
  <rect fill="url(#scanG)" width="800" height="3" style="animation:scanMove 5s ease-in-out infinite"/>

  <!-- Corner HUD brackets -->
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity=".6">
    <polyline points="2,20 2,2 20,2"/>
    <polyline points="780,2 798,2 798,20"/>
    <polyline points="798,200 798,218 780,218"/>
    <polyline points="20,218 2,218 2,200"/>
  </g>

  <!-- Matrix rain columns -->
  <text fill="#00FF9D" font-family="monospace" font-size="10" opacity="0" style="animation:rain 4s linear infinite;animation-delay:0s"><tspan x="65" y="0">0xF7</tspan></text>
  <text fill="#00FF9D" font-family="monospace" font-size="10" opacity="0" style="animation:rain 3.5s linear infinite;animation-delay:.8s"><tspan x="155" y="0">1011</tspan></text>
  <text fill="#00F0FF" font-family="monospace" font-size="10" opacity="0" style="animation:rain 4.5s linear infinite;animation-delay:.3s"><tspan x="245" y="0">DEAD</tspan></text>
  <text fill="#00FF9D" font-family="monospace" font-size="10" opacity="0" style="animation:rain 3s linear infinite;animation-delay:1.2s"><tspan x="345" y="0">C0DE</tspan></text>
  <text fill="#00F0FF" font-family="monospace" font-size="10" opacity="0" style="animation:rain 4.2s linear infinite;animation-delay:.5s"><tspan x="455" y="0">BEEF</tspan></text>
  <text fill="#00FF9D" font-family="monospace" font-size="10" opacity="0" style="animation:rain 3.8s linear infinite;animation-delay:1s"><tspan x="555" y="0">0xFF</tspan></text>
  <text fill="#00F0FF" font-family="monospace" font-size="10" opacity="0" style="animation:rain 4.8s linear infinite;animation-delay:.2s"><tspan x="645" y="0">A55A</tspan></text>
  <text fill="#00FF9D" font-family="monospace" font-size="10" opacity="0" style="animation:rain 3.2s linear infinite;animation-delay:1.5s"><tspan x="735" y="0">F00D</tspan></text>

  <!-- Glowing nodes at grid intersections -->
  <circle cx="100" cy="44" fill="#00F0FF" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:0s"/>
  <circle cx="300" cy="88" fill="#00FF9D" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:.6s"/>
  <circle cx="500" cy="132" fill="#A855F7" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:1.2s"/>
  <circle cx="700" cy="44" fill="#00F0FF" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:1.8s"/>
  <circle cx="200" cy="176" fill="#FF0055" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:.3s"/>
  <circle cx="600" cy="176" fill="#00FF9D" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:.9s"/>
  <circle cx="400" cy="44" fill="#A855F7" style="animation:nodeGlow 3s ease-in-out infinite;animation-delay:1.5s"/>

  <!-- Connecting circuit lines -->
  <g stroke="#00F0FF" stroke-width="1" fill="none" opacity=".15" stroke-dasharray="6 4" style="animation:dash 20s linear infinite">
    <path d="M100,44 L300,88 L500,132 L700,44"/>
    <path d="M200,176 L400,44 L600,176"/>
  </g>

  <!-- Central title -->
  <g filter="url(#neon)" style="animation:glow 3s ease-in-out infinite">
    <text x="400" y="100" text-anchor="middle" fill="#00FF9D" font-family="'Courier New',monospace" font-size="18" font-weight="bold">◈ SECURITY OPERATIONS CENTER ◈</text>
  </g>
  <text x="400" y="125" text-anchor="middle" fill="#94A3B8" font-family="'Courier New',monospace" font-size="11">THREAT MONITOR ACTIVE — ZERO-TRUST ENFORCED — ALL SYSTEMS NOMINAL</text>

  <!-- Status indicators -->
  <g filter="url(#neon2)">
    <circle cx="315" cy="148" r="3" fill="#00FF9D" style="animation:blink 2s ease-in-out infinite"/>
    <text x="325" y="152" fill="#00FF9D" font-family="monospace" font-size="10">FIREWALL</text>
    <circle cx="415" cy="148" r="3" fill="#00F0FF" style="animation:blink 2.5s ease-in-out infinite"/>
    <text x="425" y="152" fill="#00F0FF" font-family="monospace" font-size="10">IDS/IPS</text>
    <circle cx="495" cy="148" r="3" fill="#A855F7" style="animation:blink 1.8s ease-in-out infinite"/>
    <text x="505" y="152" fill="#A855F7" font-family="monospace" font-size="10">SIEM</text>
  </g>

  <!-- Bottom hex data stream -->
  <text fill="#1e293b" font-family="monospace" font-size="8" style="animation:dash 30s linear infinite">
    <tspan x="10" y="210">4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00 B8 00 00 00 00 00 00 00 40 00 00 00 00 00 00 00 0E 1F BA 0E 00 B4 09 CD 21 B8 01 4C CD 21 54 68 69 73</tspan>
  </text>
</svg>
