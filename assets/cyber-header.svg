  </filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/>
  </pattern>
</defs>

<rect width="1400" height="420" rx="24" fill="url(#bg)"/>
