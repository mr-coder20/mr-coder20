<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="800" height="12">
  <defs>
    <style>
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1000px)} }
      @keyframes lineGlow { 0%,100%{opacity:.3} 50%{opacity:.6} }
    </style>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="12" fill="transparent"/>
  <g filter="url(#gl)" style="animation:lineGlow 3s ease-in-out infinite">
    <line x1="0" y1="6" x2="800" y2="6" stroke="url(#lg)" stroke-width="1.5"/>
  </g>
  <rect width="120" height="4" y="4" rx="2" fill="url(#sw)" opacity=".6" style="animation:sweep 3s linear infinite"/>
</svg>
