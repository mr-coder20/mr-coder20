<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
      @keyframes bar1{0%,100%{width:120px}25%{width:90px}50%{width:140px}75%{width:100px}}
      @keyframes bar2{0%,100%{width:80px}30%{width:110px}60%{width:70px}90%{width:95px}}
      @keyframes bar3{0%,100%{width:60px}40%{width:100px}80%{width:50px}}
      @keyframes bar4{0%,100%{width:140px}20%{width:100px}60%{width:150px}80%{width:120px}}
      @keyframes scanPulse{0%,100%{opacity:.3}50%{opacity:.8}}
      @keyframes textStream{0%{opacity:0;transform:translateY(5px)}10%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-5px)}}
      @keyframes ring{0%{stroke-dashoffset:283}100%{stroke-dashoffset:0}}
      @keyframes dotBlink{0%,49%{fill:#00FF9D}50%,100%{fill:#0a0e17}}
    </style>
    <filter id="gl"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060910"/><stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="180" fill="url(#bgG)" rx="6"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="24" fill="#0d1117" rx="6"/>
  <circle cx="16" cy="12" r="4" fill="#FF5F57"/><circle cx="32" cy="12" r="4" fill="#FFBD2E"/><circle cx="48" cy="12" r="4" fill="#28CA42"/>
  <text x="400" y="16" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">soc-dashboard@cyber-core:~/threat-monitor</text>

  <!-- Left panel: Threat Sources -->
  <text x="20" y="48" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">THREAT FEEDS</text>
  <g font-family="monospace" font-size="9">
    <circle cx="28" cy="64" r="3" fill="#00FF9D" style="animation:blink 2s infinite"/><text x="38" y="67" fill="#94A3B8">VirusTotal</text>
    <rect x="110" y="60" height="6" rx="3" fill="#00FF9D" style="animation:bar1 4s ease-in-out infinite"/>
    <circle cx="28" cy="82" r="3" fill="#00F0FF" style="animation:blink 2.5s infinite"/><text x="38" y="85" fill="#94A3B8">AbuseIPDB</text>
    <rect x="110" y="78" height="6" rx="3" fill="#00F0FF" style="animation:bar2 5s ease-in-out infinite"/>
    <circle cx="28" cy="100" r="3" fill="#A855F7" style="animation:blink 1.8s infinite"/><text x="38" y="103" fill="#94A3B8">AlienVault OTX</text>
    <rect x="110" y="96" height="6" rx="3" fill="#A855F7" style="animation:bar3 3.5s ease-in-out infinite"/>
    <circle cx="28" cy="118" r="3" fill="#FF0055" style="animation:blink 3s infinite"/><text x="38" y="121" fill="#94A3B8">URLhaus</text>
    <rect x="110" y="114" height="6" rx="3" fill="#FF0055" style="animation:bar4 4.5s ease-in-out infinite"/>
  </g>

  <!-- Center panel: Threat Ring -->
  <g transform="translate(360,100)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00FF9D" stroke-width="4" stroke-dasharray="283" stroke-linecap="round" style="animation:ring 6s linear infinite" transform="rotate(-90)"/>
    <text x="0" y="3" text-anchor="middle" fill="#00FF9D" font-family="monospace" font-size="14" font-weight="bold" filter="url(#gl)">97%</text>
    <text x="0" y="16" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="7">UPTIME</text>
  </g>

  <!-- Right panel: Live Log Stream -->
  <text x="480" y="48" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">LIVE EVENT STREAM</text>
  <g font-family="monospace" font-size="8.5">
    <text x="480" y="66" fill="#00FF9D" style="animation:textStream 4s linear infinite;animation-delay:0s">[14:07:21] IOC scanned: 185.x.x.42 → CLEAN</text>
    <text x="480" y="80" fill="#FF0055" style="animation:textStream 4s linear infinite;animation-delay:1s">[14:07:19] ALERT: Suspicious JWT token detected</text>
    <text x="480" y="94" fill="#00F0FF" style="animation:textStream 4s linear infinite;animation-delay:2s">[14:07:15] L7 probe: 200 OK — latency 42ms</text>
    <text x="480" y="108" fill="#A855F7" style="animation:textStream 4s linear infinite;animation-delay:3s">[14:07:12] Frida hook: SSL pinning bypassed</text>
    <text x="480" y="122" fill="#00FF9D" style="animation:textStream 4s linear infinite;animation-delay:0.5s">[14:07:08] Nmap scan completed: 3 hosts up</text>
  </g>

  <!-- Bottom status bar -->
  <rect x="0" y="156" width="800" height="24" fill="#0d1117" rx="0"/>
  <g font-family="monospace" font-size="9">
    <rect x="12" y="164" width="6" height="6" rx="1" fill="#00FF9D" style="animation:dotBlink 1s step-end infinite"/>
    <text x="24" y="170" fill="#00FF9D">SHIELDS UP</text>
    <text x="120" y="170" fill="#475569">│</text>
    <text x="135" y="170" fill="#00F0FF">SIEM: ACTIVE</text>
    <text x="230" y="170" fill="#475569">│</text>
    <text x="245" y="170" fill="#A855F7">IDS/IPS: MONITORING</text>
    <text x="400" y="170" fill="#475569">│</text>
    <text x="415" y="170" fill="#94A3B8">PACKETS INSPECTED: </text><text x="545" y="170" fill="#00FF9D" style="animation:blink 1.5s infinite">1,847,293</text>
    <text x="640" y="170" fill="#475569">│</text>
    <text x="655" y="170" fill="#FF0055" style="animation:blink 2s infinite">● REC</text>
  </g>
</svg>
